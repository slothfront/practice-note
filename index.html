<body>
<div id="app"></div>
<script>
'use strict';
/* ===== 設定 =====
   GAS_URL が空のあいだは「見本モード」（スマホの中だけで動く・本物には送らない） */
const GAS_URL = 'https://script.google.com/macros/s/AKfycbxONTyT55jOqV12OJ_zWSkl8_twA-D3VZa05XI5MdI6baa14Qw06jIdtZdWlyLu8OE2/exec';
const DEMO = !GAS_URL;

/* ===== 保存（使えない端末でも落ちない） ===== */
/* 顧問が「部員の画面で見る」をしている間は、端末に何も書かない */
const viewing = () => typeof S !== 'undefined' && !!S.viewAs;
const store = {
  get(k, d) { try { const v = localStorage.getItem('pn_' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { if (viewing()) return; try { localStorage.setItem('pn_' + k, JSON.stringify(v)); } catch (e) {} },
  del(k) { if (viewing()) return; try { localStorage.removeItem('pn_' + k); } catch (e) {} }
};

/* ===== 通信 ===== */
async function api(action, body) {
  if (DEMO) return demoApi(action, body);
  const res = await fetch(GAS_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action, ...body }) });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const j = await res.json();
  if (!j.ok) { const e = new Error(j.error || 'error'); e.server = true; throw e; }
  return j;
}

/* 見本モードの受け口（GASと同じ形で返す） */
function demoDb() {
  let db = store.get('demo_db2', null);
  if (!db) {
    const E = (id, uid, date, o) => ({ id, uid, date, type: 'practice', focus: '', n1: 3, n2: 3, n3: 3, r1: '', r2: '', r3: '', good: '', bad: '', heard: '', next: '', at: date + 'T19:00:00+09:00', ...o });
    db = { users: { demo: { id: 'uA', name: '部員A' }, demo2: { id: 'uB', name: '部員B' }, demo3: { id: 'uC', name: '部員C' }, coach: { id: 'coach', name: '佐藤', role: 'coach' } }, entries: [
      E('d1', 'uA', '2026-11-16', { focus: 'ネット際は最初の一歩', n1: 2, r1: 'ネット際に間に合わなかった', bad: '移動が遅かった。ボールを見てから動いていた', next: '声を一番に出す' }),
      E('d2', 'uA', '2026-11-17', { focus: '声を一番に出す', n1: 4, n2: 4, n3: 5, good: '「はい」を先に言えてお見合いが無かった', next: '構えを早く作る' }),
      E('d3', 'uA', '2026-11-18', { focus: '構えを早く作る', n1: 3, n2: 4, n3: 4, bad: 'サーブカットが長くなった', heard: '腕を振らずに面を向ける、と言われた', next: 'サーブカットで腕を振らず、面を向ける' }),
      E('b1', 'uB', '2026-11-17', { focus: 'スパイクを最後まで振り切る', n1: 4, n2: 4, n3: 4, good: '強打が3本決まった', next: 'ブロックの上から打つ' }),
      E('b2', 'uB', '2026-11-18', { type: 'match', focus: 'ブロックの上から打つ', opp: '練習試合 安房 1-2', n1: 3, n2: 2, n3: 3, n4: 3, r2: 'ふくらはぎがつった', mgood: '2セット目の終盤、ライトから2本続けて決めた', mbad: 'サーブカットが乱れて、こちらの攻撃が単調になった。足が止まっていたから', tgood: '負けていても声が切れなかった', tbad: 'お見合いが多かった', mprac: '二段トスの練習', next: 'サーブカットは足を止めない', tocoach: 'ふくらはぎのストレッチのやり方を知りたいです', at: '2026-11-18T20:10:00+09:00' }),
      E('c1', 'uC', '2026-11-19', { focus: 'トスの高さをそろえる', n1: 4, n2: 3, n3: 2, r3: 'テスト前で不安', good: 'Aクイックが2本合った', next: '二段トスも高さをそろえる', at: '2026-11-19T18:40:00+09:00' })
    ], replies: [
      { id: 'r1', entryId: 'd2', text: '声、よく出ていました。', at: '2026-11-17T21:00:00+09:00' },
      { id: 'r2', entryId: 'd3', text: '構えが早くなってきたのは見ていて分かります。明日は面の向きを。', at: '2026-11-18T21:30:00+09:00' },
      { id: 'r3', entryId: 'b1', text: '振り切れていました。', at: '2026-11-17T21:10:00+09:00' }
    ] };
    store.set('demo_db2', db);
  }
  return db;
}
async function demoApi(action, b) {
  await new Promise(r => setTimeout(r, 250));
  if (!navigator.onLine) throw new Error('offline');
  const db = demoDb();
  const user = db.users[b.key];
  if (!user) { const e = new Error('合言葉がちがいます'); e.server = true; throw e; }
  const isCoach = user.role === 'coach';
  if (action === 'login') return { ok: true, name: user.name, me: user.id, role: isCoach ? 'coach' : 'student', needSet: false };
  if (action === 'submit' && !isCoach) {
    if (!db.entries.some(x => x.id === b.entry.id)) db.entries.push({ ...b.entry, uid: user.id });
    store.set('demo_db2', db); return { ok: true, id: b.entry.id };
  }
  if (action === 'list' && !isCoach) {
    const mine = db.entries.filter(x => x.uid === user.id).map(({ uid, ...x }) => x);
    const ids = new Set(mine.map(x => x.id));
    return { ok: true, name: user.name, entries: mine, replies: db.replies.filter(r => ids.has(r.entryId)), reports: (db.reports || []).filter(r => r.uid === user.id || r.uid === 'team'), jumps: db.jumps || [] };
  }
  if (action === 'coachList' && isCoach) {
    return { ok: true, name: user.name, members: Object.values(db.users).filter(u => u.role !== 'coach').map(u => ({ id: u.id, name: u.name })), entries: db.entries, replies: db.replies, reports: db.reports || [], jumps: db.jumps || [] };
  }
  if (action === 'reply' && isCoach) {
    if (!db.entries.some(x => x.id === b.entryId)) { const e = new Error('記録が見つかりません'); e.server = true; throw e; }
    const r = { id: 'r' + Date.now().toString(36), entryId: b.entryId, text: b.text, at: new Date().toISOString(), by: user.name, byId: user.id, edited: '' };
    db.replies.push(r); store.set('demo_db2', db); return { ok: true, reply: r };
  }
  if (action === 'editReply' && isCoach) { const r = db.replies.find(x => x.id === b.replyId); if (!r) throw Object.assign(new Error('返事が見つかりません'), { server: true }); r.text = b.text; r.edited = new Date().toISOString(); store.set('demo_db2', db); return { ok: true, reply: r }; }
  if (action === 'deleteReply' && isCoach) { db.replies = db.replies.filter(x => x.id !== b.replyId); store.set('demo_db2', db); return { ok: true }; }
  if (action === 'star' && !isCoach) { const e = db.entries.find(x => x.id === b.entryId && x.uid === user.id); if (!e) throw Object.assign(new Error('記録が見つかりません'), { server: true }); e.star = b.star ? '1' : ''; store.set('demo_db2', db); return { ok: true }; }
  if (action === 'addJumps' && isCoach) { db.jumps = db.jumps || []; const out = b.rows.map((r, i) => ({ id: 'j' + Date.now().toString(36) + i, uid: r.uid, name: /^ref:/.test(r.uid) ? r.uid.slice(4) : (Object.values(db.users).find(u => u.id === r.uid) || {}).name || '？', date: r.date, stand: r.stand || '', run: r.run || '', reach: r.reach || '' })); const ks = new Set(out.map(x => x.uid + '|' + x.date)); db.jumps = db.jumps.filter(j => !ks.has(j.uid + '|' + j.date)).concat(out); store.set('demo_db2', db); return { ok: true, jumps: out }; }
  if (action === 'deleteJumps' && isCoach) { db.jumps = (db.jumps || []).filter(j => j.date !== b.date); store.set('demo_db2', db); return { ok: true }; }

/* ===== 試合レポート ===== */
/* 受け口からは {id, matchId, uid, at, data(文字列)} で来る。data＝レポートのファイルの中の1人分（uid=team はチーム版） */
function parseReports(list) {
  return (list || []).map(r => { let d = r.data; if (typeof d === 'string') { try { d = JSON.parse(d); } catch (e) { d = null; } } return d ? { id: String(r.id), matchId: String(r.matchId), uid: String(r.uid), at: String(r.at || ''), d } : null; }).filter(Boolean);
}
const rkeyRep = r => r.id + '@' + r.at;
const myReports = () => S.reports.filter(r => r.uid !== 'team').sort((a, b) => (b.d.match.date || '').localeCompare(a.d.match.date || '') || Date.parse(b.at) - Date.parse(a.at));
const teamReportOf = mid => S.reports.find(r => r.uid === 'team' && r.matchId === mid);
const unseenRep = () => S.reports.filter(r => !S.seenRep.includes(rkeyRep(r)));
const pct = x => x == null ? '—' : (Math.round(Math.abs(x) * 100) * (x < 0 ? -1 : 1) < 0 ? '−' : '') + Math.round(Math.abs(x) * 100) + '%';
const share = (a, b) => b ? Math.round(a / b * 100) + '%' : '—';
const pdiff = (a, b) => { if (a == null || b == null) return '—'; const v = Math.round(a * 100) - Math.round(b * 100); return (v > 0 ? '+' : v < 0 ? '−' : '±') + Math.abs(v); };
const sl = (k, v) => `<div class="sline"><b>${k}</b>${v}</div>`;

  const vs = prev ? prev.stats || {} : null;
  const cmp = (lab, a, b, f) => sl(lab, `${f(a)}　<span class="mini">前回 ${f(b)}${a != null && b != null && f === pct ? `（${pdiff(a, b)}）` : ''}</span>`);
  return `<div class="h"><span class="en">MATCH STATS</span><span class="ja">この試合の数字</span></div><div class="card">
    ${sl('スパイク', `決定 ${n.kill}　ミス ${n.serr}`)}${sl('　（第2〜第5セット）', `打数 ${n.att}　決定率 ${pct(n.krate)}　効果率 ${pct(n.keff)}`)}
    ${sl('サーブ', `本数 ${n.sv}　エース ${n.ace}　ミス ${n.sverr}　効果率 ${pct(n.seff)}`)}
    ${sl('サーブレシーブ', `ミス ${n.recv}`)}${sl('レシーブ', `上げた ${n.dig}　ミス ${n.derr}`)}${sl('ブロック', `決定 ${n.blk}　タッチ ${n.bt}`)}
    ${sl('そのほかのミス', `カバー ${n.cov}　トス ${n.toss}　返球 ${n.ret}　その他 ${n.oth}`)}
    <div class="rnote" style="margin-top:6px">効果率＝（決定−ミス）÷打数、サーブは（エース−ミス）÷本数。${esc((notes || []).join(''))}</div></div>
  <div class="h"><span class="en">IN THE TEAM</span><span class="ja">チームの中で</span></div><div class="card">
    <div class="subh">チームに占める割合</div>
    ${sl('スパイク', `打数 ${share(n.att, T.att)}　決定 ${share(n.k25, T.k25)}　ミス ${share(n.e25, T.e25)}`)}
    ${sl('サーブ', `本数 ${share(n.sv, T.sv)}　エース ${share(n.ace, T.ace)}　ミス ${share(n.sverr, T.sverr)}`)}
    ${sl('サーブレシーブ', `ミス ${share(n.recv, T.recv)}`)}${sl('レシーブ', `上げた ${share(n.dig, T.dig)}　ミス ${share(n.derr, T.derr)}`)}
    <div class="subh">チーム全体との差（ポイント）</div>
    ${sl('スパイク決定率', `${few ? '—（打数5本未満）' : pdiff(n.krate, T.krate)}（チーム ${pct(T.krate)}）`)}
    ${sl('スパイク効果率', `${few ? '—（打数5本未満）' : pdiff(n.keff, T.keff)}（チーム ${pct(T.keff)}）`)}
    ${sl('サーブ効果率', `${pdiff(n.seff, T.seff)}（チーム ${pct(T.seff)}）`)}
    <div class="subh">前回との比較</div>
    ${vs ? `<div class="rnote">前回＝${esc(prev.match.title || '')}（${esc(prev.match.date || '')}）</div>` +
      cmp('スパイク決定率', few ? null : n.krate, (vs.att || 0) < 5 ? null : vs.krate, pct) + cmp('スパイク効果率', few ? null : n.keff, (vs.att || 0) < 5 ? null : vs.keff, pct) +
      cmp('サーブ効果率', n.seff, vs.seff, pct) + cmp('サーブレシーブのミス', n.recv, vs.recv, x => x == null ? '—' : x + '本') + cmp('レシーブで上げた', n.dig, vs.dig, x => x == null ? '—' : x + '本')
      : '<div class="rnote">この試合が1回目です。次の試合から並べます。</div>'}</div>`;
}

/* ---- 顧問：レポートを読み込んで送る ---- */
const normName = x => String(x || '').replace(/[\s　]/g, '');
function guessUid(name) {
  const n = normName(name); const mem = S.cd.members || [];
  const hit = mem.filter(m => { const k = normName(m.name); return k && (n.includes(k) || k.includes(n)); });
  return hit.length === 1 ? hit[0].id : '';
}
function itemsOf(rep, map) {
  const base = { match: rep.match, notes: rep.notes || [] };
  const items = rep.players.map((p, i) => map[i] ? { uid: map[i], data: JSON.stringify(Object.assign({}, base, { teamStats: rep.team.stats, player: p })) } : null).filter(Boolean);
  if (rep.team) items.push({ uid: 'team', data: JSON.stringify(Object.assign({}, base, { sections: rep.team.sections, stats: rep.team.stats })) });
  return items;
}

/* ===== ジャンプ測定 ===== */
/* 1行＝測定日×部員。stand・run は試技の数字を空白区切りで（例 "253.5 255.5"）。reach＝指高（測ったときだけ） */
const NET = 224;
const nums = t => String(t || '').split(/[\s,、　]+/).map(Number).filter(x => isFinite(x) && x > 0);
const best = t => { const a = nums(t); return a.length ? Math.max(...a) : null; };
function jumpTable(all) {
  const rd = v => v == null ? null : Math.round(v * 10) / 10;
  const withDiff = (o, reach) => Object.assign(o, { vj: reach && o.stand ? rd(o.stand - reach) : null, jh: reach && o.run ? rd(o.run - reach) : null });
  const ru = {}; all.filter(j => /^ref:/.test(j.uid)).forEach(j => { ru[j.uid] = j; });
  const refs = Object.values(ru).map(j => withDiff({ name: j.name, run: best(j.run), stand: best(j.stand) }, Number(j.reach) > 0 ? Number(j.reach) : null));
  /* 同じ部員・同じ測定日が何行あっても1つにする（あとの行を使う） */
  const uniq = {}; all.filter(j => !/^ref:/.test(j.uid)).forEach(j => { uniq[j.uid + '|' + j.date] = j; }); const jumps = Object.values(uniq);
  const reachOf = {}; [...jumps].sort((a, b) => a.date.localeCompare(b.date)).forEach(j => { if (Number(j.reach) > 0) reachOf[j.uid] = Number(j.reach); });
  const people = {}; jumps.forEach(j => { (people[j.uid] = people[j.uid] || { uid: j.uid, name: j.name, rows: [] }).rows.push({ date: j.date, stand: best(j.stand), run: best(j.run), id: j.id }); });
  Object.values(people).forEach(p => { p.rows.sort((a, b) => a.date.localeCompare(b.date)); p.reach = reachOf[p.uid] || null; p.rows.forEach(r => withDiff(r, p.reach)); });
  const dates = [...new Set(jumps.map(j => j.date))].sort();
  return { people: Object.values(people), dates, refs };
}
const fmtd = d => { const [y, m, dd] = d.split('-').map(Number); return `${String(y).slice(2)}/${m}/${dd}`; };
/* 折れ線：key＝'run'（最高到達点）・'stand'（その場の到達点）・'vj'（垂直跳び＝その場−指高）・'jh'（跳躍高＝最高到達点−指高）。me の線を太い青、ほかは灰色 */
function jumpChart(T, key, me, title) {
  const ps = T.people.filter(p => p.rows.some(r => r[key] != null)); if (!ps.length || !T.dates.length) return '';
  const rf = (T.refs || []).filter(r => r[key] != null);
  const vals = ps.flatMap(p => p.rows.map(r => r[key]).filter(v => v != null)).concat(key === 'run' ? [NET] : [], rf.map(r => r[key]));
  const lo = Math.floor((Math.min(...vals) - 4) / 5) * 5, hi = Math.ceil((Math.max(...vals) + 4) / 5) * 5;
  const W = 330, H = 230, x0 = 38, x1 = 262, yT = 14, yB = 196;
  const x = i => T.dates.length === 1 ? (x0 + x1) / 2 : x0 + (x1 - x0) * i / (T.dates.length - 1);
  const y = v => yB - (yB - yT) * (v - lo) / (hi - lo);
  const ticks = []; for (let v = lo; v <= hi; v += (hi - lo > 40 ? 10 : 5)) ticks.push(v);
  const order = [...ps.filter(p => p.uid !== me), ...ps.filter(p => p.uid === me)];
  const P = order.map(p => ({ p, mine: p.uid === me, pts: p.rows.filter(r => r[key] != null).map(r => [x(T.dates.indexOf(r.date)), y(r[key])]) }));
  /* 名前のラベルが重ならないように、同じ列の近いものを縦にずらす */
  const labs = P.map(o => ({ o, lx: o.pts[o.pts.length - 1][0] + 6, ly: o.pts[o.pts.length - 1][1] + 4 }));
  [...new Set(labs.map(l => l.lx))].forEach(cx => { const g = labs.filter(l => l.lx === cx).sort((a, b) => a.ly - b.ly); for (let i = 1; i < g.length; i++) if (g[i].ly - g[i - 1].ly < 12) g[i].ly = g[i - 1].ly + 12; });
  const lines = labs.map(({ o, lx, ly }) => { const c = o.mine ? '#1F4E79' : '#9aa5b1';
    return `<polyline fill="none" stroke="${c}" stroke-width="${o.mine ? 3.2 : 1.6}" points="${o.pts.map(q => q.join(',')).join(' ')}"/>` + o.pts.map(q => `<circle cx="${q[0]}" cy="${q[1]}" r="${o.mine ? 4 : 2.8}" fill="${c}"/>`).join('') +
      `<text x="${lx}" y="${ly}" font-size="${o.mine ? 12 : 10}" font-weight="${o.mine ? 700 : 400}" fill="${c}">${esc(o.p.name)}</text>`; }).join('');
  return `<div class="card"><div class="subh" style="margin-top:0">${title}</div><svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${title}">
    <g stroke="#e3e8ef">${ticks.map(v => `<line x1="${x0}" x2="${x1}" y1="${y(v)}" y2="${y(v)}"/>`).join('')}</g>
    <g font-size="10" fill="#6f7782">${ticks.map(v => `<text x="4" y="${y(v) + 4}">${v}</text>`).join('')}${T.dates.map((d, i) => `<text x="${x(i)}" y="${H - 14}" text-anchor="middle">${fmtd(d)}</text>`).join('')}</g>
    ${key === 'run' && NET >= lo && NET <= hi ? `<line x1="${x0}" x2="${x1}" y1="${y(NET)}" y2="${y(NET)}" stroke="#E0A800" stroke-width="2" stroke-dasharray="6 4"/><text x="${x0 + 2}" y="${y(NET) - 4}" font-size="10" fill="#9a7400">ネット ${NET}</text>` : ''}
    ${rf.map(r => `<line x1="${x0}" x2="${x1}" y1="${y(r[key])}" y2="${y(r[key])}" stroke="#2E75B6" stroke-width="1.2" stroke-dasharray="2 3"/><text x="${x0 + 2}" y="${y(r[key]) - 3}" font-size="9" fill="#2E75B6" stroke="#fff" stroke-width="3" paint-order="stroke">${esc(r.name)}のベスト ${r[key]}</text>`).join('')}
    ${lines}</svg>${rf.length ? '<div class="rnote">青の点線＝先輩のベスト（参考）</div>' : ''}</div>`;
}
function jumpLatestList(T, me) {
  const bst = (p, k) => { const v = p.rows.map(x => x[k]).filter(x => x != null); return v.length ? Math.max(...v) : '—'; };
  const rows = T.people.map(p => { const r = p.rows[p.rows.length - 1];

  const refl = (T.refs || []).map(r => `<div class="sline"><b>${esc(r.name)}</b>最高到達点 ${r.run ?? '—'}　その場 ${r.stand ?? '—'}${r.jh != null ? `　跳躍高 ${r.jh}　垂直跳び ${r.vj ?? '—'}` : ''}</div>`).join('');

    <div class="rnote" style="margin-top:6px">最高到達点＝助走して跳んで触った高さ／その場の到達点＝その場で跳んで触った高さ／跳躍高＝最高到達点−指高／垂直跳び＝その場の到達点−指高（cm）</div></div>`;

    ${T.people.some(p => !p.reach) ? '<div class="rnote" style="margin:-4px 0 8px">跳躍高・垂直跳びは、指高を測った人だけ出ます</div>' : ''}${jumpLatestList(T, me)}`;

  return `<div class="h"><span class="en">COACH MEMO</span><span class="ja">顧問だけのメモ（部員には見えません）</span></div>
    <div class="card"><textarea id="cnew" placeholder="けが・面談・気づいたことなど">${esc((S.cDraft || {})[uid] || '')}</textarea><button class="btn" id="csend" style="margin-top:8px;padding:11px">メモを残す</button></div>
    <div class="list" style="margin-top:8px">${list.map(n => cnoteCard(n, false)).join('') || '<p class="mini center">まだメモはありません</p>'}</div>`;
}
function bindCnotes(uid) {
  const t = $('#cnew'); if (t) t.addEventListener('input', () => { S.cDraft = Object.assign({}, S.cDraft, { [uid]: t.value }); });
  const sb = $('#csend'); if (sb) sb.onclick = async () => {
    const text = $('#cnew').value.trim(); if (!text) { toast('書いてから送ってください'); return; }
    sb.disabled = true;
    try { const j = await api('cnote', { key: S.key, uid, text }); S.cd.cnotes = [...(S.cd.cnotes || []), j.note]; store.set('cd', S.cd); S.cDraft = Object.assign({}, S.cDraft, { [uid]: '' }); toast(uid === 'board' ? '送りました' : 'メモを残しました'); render(); }
    catch (e) { sb.disabled = false; toast(e.server ? e.message : 'ネットにつながっていません。つながってからもう一度'); }
  };
  document.querySelectorAll('.cedit').forEach(b => b.onclick = () => { S.editingC = b.dataset.cid; render(); });
  document.querySelectorAll('.ccancel').forEach(b => b.onclick = () => { S.editingC = null; render(); });
  document.querySelectorAll('.csave').forEach(b => b.onclick = async () => {
    const id = b.dataset.cid; const text = $('#ced_' + id).value.trim(); if (!text) { toast('空では保存できません。消すときは「消す」を'); return; }
    b.disabled = true;
    try { const j = await api('editCnote', { key: S.key, noteId: id, text }); S.cd.cnotes = S.cd.cnotes.map(n => n.id === id ? j.note : n); store.set('cd', S.cd); S.editingC = null; toast('直しました'); render(); }
    catch (e) { b.disabled = false; toast(e.server ? e.message : 'ネットにつながっていません'); }
  });
  document.querySelectorAll('.cdel').forEach(b => b.onclick = async () => {
    if (!confirm('このメモを消します。よいですか？')) return; const id = b.dataset.cid; b.disabled = true;
    try { await api('deleteCnote', { key: S.key, noteId: id }); S.cd.cnotes = S.cd.cnotes.filter(n => n.id !== id); store.set('cd', S.cd); toast('消しました'); render(); }
    catch (e) { b.disabled = false; toast(e.server ? e.message : 'ネットにつながっていません'); }
  });
}
function renderBoard() {
  const list = cnotesOf('board');
  shell('顧問用　' + S.name, `<div class="h" style="margin-top:4px"><span class="en">COACHES</span><span class="ja">顧問の連絡ボード（部員には見えません）</span></div>
    <div class="card"><div class="q" style="margin-top:0">書く場所</div><select id="cto"><option value="board" ${S.cTo === 'board' || !S.cTo ? 'selected' : ''}>連絡ボード（先生どうし）</option><optgroup label="部員ごとのメモ">${(S.cd.members || []).map(m => `<option value="${m.id}" ${S.cTo === m.id ? 'selected' : ''}>${esc(m.name)}のメモ</option>`).join('')}</optgroup></select>
      <textarea id="cnew" style="margin-top:8px" placeholder="${!S.cTo || S.cTo === 'board' ? 'ほかの先生への連絡・共有したいこと' : 'けが・面談・気づいたことなど'}">${esc((S.cDraft || {})[S.cTo || 'board'] || '')}</textarea><button class="btn" id="csend" style="margin-top:8px;padding:11px">${!S.cTo || S.cTo === 'board' ? '送る' : 'メモを残す'}</button></div>
    <div class="list" style="margin-top:10px">${list.map(n => cnoteCard(n, true)).join('') || '<p class="mini center">まだ書き込みはありません</p>'}</div>
    <div class="h"><span class="en">MEMO</span><span class="ja">部員ごとのメモ（新しい順）</span></div>
    ${(() => { const ms = (S.cd.cnotes || []).filter(n => n.uid !== 'board').sort((a, b) => Date.parse(b.at) - Date.parse(a.at)).slice(0, 20);
      return ms.length ? ms.map(n => `<div class="mini" style="margin:10px 0 2px"><button class="link cmem" data-uid="${n.uid}" style="font-weight:700;color:var(--main)">${esc(memberName(n.uid))}</button>のメモ</div>` + cnoteCard(n, false)).join('') : '<p class="mini center">まだメモはありません</p>'; })()}
    <div class="foot"><button class="link" id="reload">最新にする</button>　<button class="link" id="logout">この端末から合言葉を消す</button></div>`);
  bindCnotes(S.cTo || 'board'); bindFoot();
  $('#cto').onchange = e => { S.cTo = e.target.value; render(); };
  document.querySelectorAll('.cmem').forEach(b => b.onclick = () => { S.tab = 'members'; S.member = b.dataset.uid; pushNav(); render(); window.scrollTo(0, 0); });
  const ids = unreadBoard().map(n => n.id);
  if (ids.length) api('cnoteRead', { key: S.key, ids }).then(() => { S.cd.creads = [...(S.cd.creads || []), ...ids.map(id => ({ noteId: id, uid: S.me }))]; store.set('cd', S.cd); }).catch(() => {});
}

/* ===== 部員：お知らせのタブ（未読と既読に分ける。「既読にする」で既読へ移る） ===== */
function renderStudentNotices() {
  const nNew = unseenN().sort((a, b) => Date.parse(b.at) - Date.parse(a.at));
  const nOld = S.notices.filter(x => !nNew.includes(x)).sort((a, b) => Date.parse(b.at) - Date.parse(a.at));
  const nCard = (x, fresh) => `<div class="notice ${fresh ? 'fresh' : ''}"><div class="date"><span>${esc(x.by)}から　<span class="mini">${x.to === 'all' ? '全員へ' : /^grade:/.test(x.to) ? x.to.slice(6) + '年へ' : 'あなたへ'}・${jdate(localDate(x.at))}${x.edited ? '（直しました）' : ''}</span></span>${fresh ? '<span class="tag">未読</span>' : '<span class="mini">既読</span>'}</div><div class="ntext">${esc(x.text)}</div>${fresh ? `<div class="rbtns"><button class="mini-btn save nok" data-nid="${x.id}">既読にする</button></div>` : ''}</div>`;
  shell(S.name, `<div class="h" style="margin-top:4px"><span class="en">UNREAD</span><span class="ja">未読（${nNew.length}件）</span></div>
    ${nNew.length ? `<div class="hint">読んだら「既読にする」を押してください。下の「既読」に移ります</div>${nNew.map(x => nCard(x, true)).join('')}` : '<p class="mini center" style="margin:14px 0">未読のお知らせはありません</p>'}
    <div class="h"><span class="en">READ</span><span class="ja">既読（${nOld.length}件）</span></div>
    ${nOld.length ? nOld.map(x => nCard(x, false)).join('') : '<p class="mini center" style="margin:14px 0">まだありません</p>'}
    <div class="foot"><button class="link" id="reload">最新にする</button></div>`);
  bindFoot();
  document.querySelectorAll('.nok').forEach(b => b.onclick = async () => {
    if (S.viewAs) { toast('見るだけの画面です'); return; }
    const id = b.dataset.nid; b.disabled = true;
    try { await api('readNotices', { key: S.key, ids: [id] }); S.readN = [...(S.readN || []).filter(r => r.noticeId !== id), { noticeId: id, at: new Date().toISOString() }]; store.set('readN', S.readN); render(); }
    catch (e) { b.disabled = false; toast('ネットにつながっていません。つながってからもう一度'); }
  });
}

function render() {
  if (!S.key) return renderLogin();
  if (S.needSet) return renderSetKey();
  if (S.role === 'coach') return renderCoach();
  if (S.tab === 'history') return renderHistory();
  if (S.tab === 'graph') return renderGraph();
  if (S.tab === 'report') return renderReports();
  if (S.tab === 'snotice') return renderStudentNotices();
  return renderToday();
}

window.addEventListener('online', async () => { await refresh(); render(); });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') saveDraft(); });
/* 更新（再読み込み）しても同じ画面にとどまる：履歴に残した画面と、閉じる前のスクロール位置から戻す */
const st0 = (() => { try { return history.state; } catch (e) { return null; } })();
const TABS = { coach: ['new', 'members', 'notice', 'creport', 'cjump', 'cboard'], student: ['today', 'history', 'graph', 'report', 'snotice'] };
if (S.key && !S.needSet && st0 && st0.pn) {
  if (S.role === 'coach' && st0.viewAs && (S.cd.members || []).some(m => m.id === st0.viewAs)) enterView(st0.viewAs);
  const ok = TABS[S.role === 'coach' ? 'coach' : 'student'];
  if (ok.includes(st0.tab)) S.tab = st0.tab;
  if (S.role === 'coach' && !S.viewAs) { S.member = st0.member || null; S.cview = st0.cview || null; }
}
try { history.replaceState(navState(), ''); } catch (e) {}
window.addEventListener('pagehide', () => { try { history.replaceState(Object.assign(navState(), { y: window.scrollY }), ''); } catch (e) {} });
render();
if (st0 && st0.y) requestAnimationFrame(() => window.scrollTo(0, st0.y));
if (S.key && S.role === 'coach') refresh().then(ok => { if (ok) render(); });
else if (S.key) refresh().then(ok => { if (!ok) return; const n = unseen().length, m = unseenN().length; if (S.tab !== 'today' || m) render(); if (n) toast(`先生からの返事が${n}件あります`); });
</script>
<script>
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
}
</script>
