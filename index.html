<style>
:root{--navy:#1F4E79;--blue:#2E75B6;--pale:#DDEBF7;--yellow:#FFC000;--ink:#1a1a1a;--gray:#6f7782;--line:#d0d7e1;--bg:#f6f8fb}

html,body{margin:0;background:var(--bg)}
body{font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;color:var(--ink);-webkit-text-size-adjust:100%}

header{background:var(--navy);color:#fff;padding:14px 16px 10px;position:sticky;top:0;z-index:5}
header .t{font-size:20px}header .s{font-size:12px;opacity:.85;margin-top:2px;min-height:1em}

.h{display:flex;align-items:baseline;gap:8px;margin:20px 0 6px;flex-wrap:wrap}.h .en{color:var(--navy);font-size:19px}.h .ja{color:var(--blue);font-size:12px;font-weight:700}

.nums{display:flex;gap:12px;font-size:12px;margin:6px 0;flex-wrap:wrap}.nums b{color:var(--navy);font-size:14px}

.coach .en{color:var(--blue);font-size:12px}
.more{display:none}.open .more{display:block}
.toggle{background:none;border:0;color:var(--blue);font:inherit;font-size:12px;padding:6px 0 0}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 18px;border-radius:24px;font-size:14px;z-index:9;box-shadow:0 4px 14px rgba(0,0,0,.2);max-width:90%;text-align:center}

.legend{display:flex;gap:14px;font-size:12px;margin-top:8px;flex-wrap:wrap}.legend i{display:inline-block;width:16px;height:0;border-top:3px solid var(--c);margin-right:4px;vertical-align:middle}
.legend i.d{border-top-style:dashed}
.login{padding-top:36px}.login .big{font-size:30px;color:var(--navy);text-align:center}

<style>
body{font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Noto Sans JP",sans-serif;background:var(--bg)}

header .t:after{content:" 🏐";font-style:normal}
nav{top:62px;background:transparent;border:0;padding:8px 12px 4px;gap:6px;backdrop-filter:blur(6px)}

</style><style>:root{--main:#22B3A6;--ink2:#1F4E79;--acc2:#FFE27A;--soft:#E3F7F4;--line2:#D3ECE8;--bg:#F3FBFA;--btn:#22B3A6;--btntext:#fff;--btnshadow:#178C82}.seg{display:flex;background:#fff;border-radius:999px;padding:4px;box-shadow:0 1px 4px rgba(0,0,0,.08);margin:4px 0 6px}
.seg button{flex:1;border:0;background:none;border-radius:999px;padding:10px 0;font:inherit;font-size:15px;font-weight:700;color:var(--gray)}

.tag.match{background:var(--ink2,#1F4E79);color:#fff;font-style:normal}
.miss{border-color:#E0A800 !important;background:#FFF6D1 !important}
.row.miss{border-radius:12px;padding:2px 4px;margin-left:-4px}
.row .lab{width:96px}
.card.low{border-left:6px solid var(--acc2,#FFC000)}

<body>
<div id="app"></div>
<script>
'use strict';
/* ===== 設定 =====
   GAS_URL が空のあいだは「見本モード」（スマホの中だけで動く・本物には送らない） */
const GAS_URL = '';
const DEMO = !GAS_URL;

/* ===== 保存（使えない端末でも落ちない） ===== */
const store = {
  get(k, d) { try { const v = localStorage.getItem('pn_' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('pn_' + k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem('pn_' + k); } catch (e) {} }
};

/* ===== 通信 ===== */
async function api(action, body) {
  if (DEMO) return demoApi(action, body);
  const res = await fetch(GAS_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action, ...body }) });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const j = await res.json();
  if (!j.ok) { const e = new Error(j.error || 'error'); e.server = true; throw e; }
  return j;
}

/* 見本モードの受け口（GASと同じ形で返す） */
function demoDb() {
  let db = store.get('demo_db2', null);
  if (!db) {
    const E = (id, uid, date, o) => ({ id, uid, date, type: 'practice', focus: '', n1: 3, n2: 3, n3: 3, r1: '', r2: '', r3: '', good: '', bad: '', heard: '', next: '', at: date + 'T19:00:00+09:00', ...o });
    db = { users: { demo: { id: 'uA', name: '部員A' }, demo2: { id: 'uB', name: '部員B' }, demo3: { id: 'uC', name: '部員C' }, coach: { id: 'coach', name: '佐藤', role: 'coach' } }, entries: [
      E('d1', 'uA', '2026-11-16', { focus: 'ネット際は最初の一歩', n1: 2, r1: 'ネット際に間に合わなかった', bad: '移動が遅かった。ボールを見てから動いていた', next: '声を一番に出す' }),
      E('d2', 'uA', '2026-11-17', { focus: '声を一番に出す', n1: 4, n2: 4, n3: 5, good: '「はい」を先に言えてお見合いが無かった', next: '構えを早く作る' }),
      E('d3', 'uA', '2026-11-18', { focus: '構えを早く作る', n1: 3, n2: 4, n3: 4, bad: 'サーブカットが長くなった', heard: '腕を振らずに面を向ける、と言われた', next: 'サーブカットで腕を振らず、面を向ける' }),
      E('b1', 'uB', '2026-11-17', { focus: 'スパイクを最後まで振り切る', n1: 4, n2: 4, n3: 4, good: '強打が3本決まった', next: 'ブロックの上から打つ' }),
      E('b2', 'uB', '2026-11-18', { type: 'match', focus: 'ブロックの上から打つ', opp: '練習試合 安房 1-2', n1: 3, n2: 2, n3: 3, n4: 3, r2: 'ふくらはぎがつった', mgood: '2セット目の終盤、ライトから2本続けて決めた', mbad: 'サーブカットが乱れて、こちらの攻撃が単調になった。足が止まっていたから', tgood: '負けていても声が切れなかった', tbad: 'お見合いが多かった', mprac: '二段トスの練習', next: 'サーブカットは足を止めない', tocoach: 'ふくらはぎのストレッチのやり方を知りたいです', at: '2026-11-18T20:10:00+09:00' }),
      E('c1', 'uC', '2026-11-19', { focus: 'トスの高さをそろえる', n1: 4, n2: 3, n3: 2, r3: 'テスト前で不安', good: 'Aクイックが2本合った', next: '二段トスも高さをそろえる', at: '2026-11-19T18:40:00+09:00' })
    ], replies: [
      { id: 'r1', entryId: 'd2', text: '声、よく出ていました。', at: '2026-11-17T21:00:00+09:00' },
      { id: 'r2', entryId: 'd3', text: '構えが早くなってきたのは見ていて分かります。明日は面の向きを。', at: '2026-11-18T21:30:00+09:00' },
      { id: 'r3', entryId: 'b1', text: '振り切れていました。', at: '2026-11-17T21:10:00+09:00' }
    ] };
    store.set('demo_db2', db);
  }
  return db;
}
async function demoApi(action, b) {
  await new Promise(r => setTimeout(r, 250));
  if (!navigator.onLine) throw new Error('offline');
  const db = demoDb();
  const user = db.users[b.key];
  if (!user) { const e = new Error('合言葉がちがいます'); e.server = true; throw e; }
  const isCoach = user.role === 'coach';
  if (action === 'login') return { ok: true, name: user.name, role: isCoach ? 'coach' : 'student' };
  if (action === 'submit' && !isCoach) {
    if (!db.entries.some(x => x.id === b.entry.id)) db.entries.push({ ...b.entry, uid: user.id });
    store.set('demo_db2', db); return { ok: true, id: b.entry.id };
  }
  if (action === 'list' && !isCoach) {
    const mine = db.entries.filter(x => x.uid === user.id).map(({ uid, ...x }) => x);
    const ids = new Set(mine.map(x => x.id));
    return { ok: true, name: user.name, entries: mine, replies: db.replies.filter(r => ids.has(r.entryId)) };
  }
  if (action === 'coachList' && isCoach) {
    return { ok: true, name: user.name, members: Object.values(db.users).filter(u => u.role !== 'coach').map(u => ({ id: u.id, name: u.name })), entries: db.entries, replies: db.replies };
  }
  if (action === 'reply' && isCoach) {
    if (!db.entries.some(x => x.id === b.entryId)) { const e = new Error('記録が見つかりません'); e.server = true; throw e; }
    const r = { id: 'r' + Date.now().toString(36), entryId: b.entryId, text: b.text, at: new Date().toISOString() };
    db.replies.push(r); store.set('demo_db2', db); return { ok: true, reply: r };
  }
  const e = new Error('できない操作です'); e.server = true; throw e;
}

/* ===== 状態 ===== */
const S = {
  key: store.get('key', ''), name: store.get('name', ''), role: store.get('role', 'student'),
  cd: store.get('cd', { members: [], entries: [], replies: [] }), member: null, showAll: false, repDraft: {},
  entries: store.get('entries', []), replies: store.get('replies', []),
  outbox: store.get('outbox', []), seen: store.get('seen', []),
  tab: 'today', draft: store.get('draft', null), justSeen: []
};
const save = () => { store.set('entries', S.entries); store.set('replies', S.replies); store.set('outbox', S.outbox); store.set('seen', S.seen); };

/* ===== 道具 ===== */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const today = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const WD = ['日', '月', '火', '水', '木', '金', '土'];
const jdate = s => { const [y, m, d] = s.split('-').map(Number); const w = WD[new Date(y, m - 1, d).getDay()]; return `${m}月${d}日（${w}）`; };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
function toast(msg) { document.querySelectorAll('.toast').forEach(x => x.remove()); const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2600); }
const allEntries = () => { const ids = new Set(S.entries.map(e => e.id)); return [...S.entries, ...S.outbox.filter(e => !ids.has(e.id)).map(e => ({ ...e, _wait: true }))].sort((a, b) => b.date.localeCompare(a.date) || (Date.parse(b.at) - Date.parse(a.at))); };
const repliesFor = id => S.replies.filter(r => r.entryId === id).sort((a, b) => Date.parse(a.at) - Date.parse(b.at));
const unseen = () => S.replies.filter(r => !S.seen.includes(r.id));
const lastNext = () => { const e = allEntries()[0]; return e ? e.next || '' : ''; };

/* ===== 同期 ===== */
async function flush() {
  if (!S.outbox.length) return;
  for (const e of [...S.outbox]) {
    try { await api('submit', { key: S.key, entry: e }); S.outbox = S.outbox.filter(x => x.id !== e.id); if (!S.entries.some(x => x.id === e.id)) S.entries.push(e); save(); }
    catch (err) { if (err.server) { /* 受け口が断った */ } break; }
  }
}
async function refresh() {
  if (S.role === 'coach') {
    try { const j = await api('coachList', { key: S.key }); S.cd = { members: j.members, entries: j.entries, replies: j.replies }; store.set('cd', S.cd); return true; } catch (e) { return false; }
  }
  try {
    await flush();
    const j = await api('list', { key: S.key });
    S.entries = j.entries; S.replies = j.replies; if (j.name) { S.name = j.name; store.set('name', j.name); }
    save(); return true;
  } catch (e) { return false; }
}

/* ===== 画面 ===== */
function shell(sub, body) {
  const n = S.role === 'coach' ? 0 : unseen().length;
  $('#app').innerHTML = (DEMO ? '<div class="demo">見本モード（本物には送られません）</div>' : '') +
    `<header><div class="t en">PRACTICE NOTE</div><div class="s">${esc(sub)}</div></header>` +
    (S.key ? (S.role === 'coach'
      ? `<nav>${[['new', '新しい記録'], ['members', '部員ごと']].map(([k, l]) => `<button data-tab="${k}" class="${S.tab === k ? 'on' : ''}">${l}${k === 'new' && unreplied().length ? `<span class="badge">${unreplied().length}</span>` : ''}</button>`).join('')}</nav>`
      : `<nav>${[['today', '今日の記録'], ['history', 'これまで'], ['graph', 'グラフ']].map(([k, l]) => `<button data-tab="${k}" class="${S.tab === k ? 'on' : ''}">${l}${k === 'history' && n ? `<span class="badge">返事 ${n}</span>` : ''}</button>`).join('')}</nav>`) : '') +
    `<main>${body}</main>`;
  document.querySelectorAll('nav button').forEach(b => b.onclick = () => go(b.dataset.tab));
}
function go(tab) { saveDraft(); S.tab = tab; S.member = null; render(); window.scrollTo(0, 0); }

function renderLogin(err) {
  shell('君商 女子バレー部', `<div class="login"><div class="big en">PRACTICE NOTE</div>
  <p class="mini center">練習のあと、その日のうちに書こう</p>
  <div class="card" style="margin-top:28px"><div class="h" style="margin-top:0"><span class="en">PASSWORD</span><span class="ja">合言葉</span></div>
  <div class="hint">佐藤からもらった合言葉を入れる。最初の1回だけ${DEMO ? '（見本は 部員＝demo・顧問＝coach）' : ''}</div>
  <input id="pw" autocomplete="off" autocapitalize="off" spellcheck="false" inputmode="text">
  ${err ? `<div class="err">${esc(err)}</div>` : ''}</div>
  <button class="btn" id="go">はじめる</button></div>`);
  $('#go').onclick = async () => {
    const key = $('#pw').value.trim(); if (!key) return;
    $('#go').disabled = true;
    try { const j = await api('login', { key }); S.key = key; S.name = j.name; S.role = j.role || 'student'; store.set('key', key); store.set('name', j.name); store.set('role', S.role); await refresh(); S.tab = S.role === 'coach' ? 'new' : 'today'; render(); if (S.role !== 'coach') { const n = unseen().length; if (n) toast(`佐藤からの返事が${n}件あります`); } }
    catch (e) { renderLogin(e.server ? '合言葉がちがいます。もう一度確かめてください' : 'ネットにつながっていません。つながる所でもう一度'); }
  };
}

const F = [['n1', '意識できた', 'r1'], ['n2', '体', 'r2'], ['n3', '気持ち', 'r3']];
const FM = [...F, ['n4', 'プレーの出来', 'r4']];
const fieldsOf = e => e.type === 'match' ? FM : F;
/* 試合のふり返り（全部必ず書く） */
const MQ = [['mgood', 'よかったプレー・できるようになったこと', 'どの試合の、どの場面か'],
  ['mbad', 'うまくいかなかったプレー・課題', 'どの場面で、なぜそうなったと思うか'],
  ['tgood', 'チームのよかったところ', ''], ['tbad', 'チームに足りなかったところ', ''],
  ['mprac', '練習で取り組みたいこと', '']];
const TEXT_KEYS = ['focus', 'good', 'bad', 'heard', 'next', 'r1', 'r2', 'r3', 'r4', 'opp', 'mgood', 'mbad', 'tgood', 'tbad', 'mprac', 'tocoach'];
function blankDraft() { const d = { date: today(), type: 'practice', focus: lastNext(), n1: 0, n2: 0, n3: 0, n4: 0 }; TEXT_KEYS.forEach(k => { if (!(k in d)) d[k] = ''; }); d.focus = lastNext(); return d; }
function saveDraft() {
  if (S.tab !== 'today' || !$('#focus')) return;
  const d = S.draft || blankDraft();
  TEXT_KEYS.forEach(k => { const el = $('#' + k); if (el) d[k] = el.value; });
  S.draft = d; store.set('draft', d);
}
function renderToday() {
  if (!S.draft || S.draft.date !== today()) S.draft = blankDraft();
  const d = S.draft; TEXT_KEYS.forEach(k => { if (d[k] == null) d[k] = ''; }); if (!d.type) d.type = 'practice';
  const M = d.type === 'match';
  const done = allEntries().filter(e => e.date === today()).length;
  const nums = (M ? FM : F).map(([n, l, r]) => `<div class="row" data-row="${n}"><span class="lab">${l}</span>${[1, 2, 3, 4, 5].map(i => `<button class="dot ${d[n] === i ? 'on' : ''}" data-n="${n}" data-v="${i}" aria-label="${l} ${i}">${i}</button>`).join('')}</div>` +
    (d[n] && d[n] <= 2 ? `<div class="why"><input id="${r}" placeholder="理由を一言" value="${esc(d[r])}"></div>` : '')).join('');
  const review = M ? `
  <div class="h"><span class="en">MATCH REVIEW</span><span class="ja">試合のふり返り</span></div><div class="hint">全部書く。場面と「なぜ」を入れて</div>
  ${MQ.map(([k, q, h]) => `<div class="q">${q}${h ? `<span class="mini">（${h}）</span>` : ''}</div><textarea id="${k}">${esc(d[k])}</textarea>`).join('')}` : `
  <div class="h"><span class="en">REVIEW</span><span class="ja">ふり返り</span></div><div class="hint">書けるものだけでOK</div>
  <div class="q">今日よかったプレーは？</div><textarea id="good" placeholder="（書かなくてもよい）">${esc(d.good)}</textarea>
  <div class="q">うまくいかなかったのは？なぜ？</div><textarea id="bad" placeholder="（書かなくてもよい）">${esc(d.bad)}</textarea>
  <div class="q">誰かに言われたこと・気づいたことは？</div><textarea id="heard" placeholder="（書かなくてもよい）">${esc(d.heard)}</textarea>`;
  shell(`${jdate(today())}　${S.name}`, `
  ${S.outbox.length ? `<div class="pending">送信待ち ${S.outbox.length}件。ネットにつながったら自動で送ります</div>` : ''}
  ${done ? `<div class="mini">今日はもう${done}回提出しています。もう一度出すと、もう1件追加されます</div>` : ''}
  <div class="seg"><button data-type="practice" class="${M ? '' : 'on'}">練習</button><button data-type="match" class="${M ? 'on' : ''}">試合</button></div>
  <div class="h"><span class="en">TODAY'S FOCUS</span><span class="ja">今日意識すること</span></div><div class="hint">前回のNEXTが入っています。変えてもよい</div>
  <textarea id="focus" class="${d.focus && d.focus === lastNext() ? 'prefill' : ''}" placeholder="今日意識すること">${esc(d.focus)}</textarea>
  ${M ? `<div class="h"><span class="en">MATCH</span><span class="ja">試合</span></div><div class="hint">相手と結果。例：令徳 1-2、木更津東 2-0</div>
  <input id="opp" placeholder="相手と結果" value="${esc(d.opp)}">` : ''}
  <div class="h"><span class="en">NUMBERS</span><span class="ja">数字（1〜5）</span></div><div class="hint">押すだけ。1・2を押したら理由を一言</div>
  <div class="card" id="nums">${nums}</div>
  ${review}
  <div class="h"><span class="en">NEXT</span><span class="ja">次にどうする</span></div><div class="hint">1つだけ。次の「今日意識すること」になる</div>
  <textarea id="next" placeholder="次にやること">${esc(d.next)}</textarea>
  ${M ? `<div class="h"><span class="en">TO COACH</span><span class="ja">顧問に伝えたいこと</span></div><div class="hint">あれば</div>
  <textarea id="tocoach" placeholder="（書かなくてもよい）">${esc(d.tocoach)}</textarea>` : ''}
  <button class="btn" id="submit">提出</button>
  <p class="mini center">電波が無いときは、つながったときに自動で送ります</p>`);
  document.querySelectorAll('.dot').forEach(b => b.onclick = () => { saveDraft(); d[b.dataset.n] = Number(b.dataset.v); store.set('draft', d); renderToday(); });
  document.querySelectorAll('.seg button').forEach(b => b.onclick = () => { saveDraft(); d.type = b.dataset.type; store.set('draft', d); renderToday(); });
  document.querySelectorAll('textarea,input').forEach(el => el.addEventListener('input', () => { el.classList.remove('miss'); saveDraft(); }));
  $('#submit').onclick = submit;
}
async function submit() {
  saveDraft(); const d = S.draft; const miss = []; const M = d.type === 'match';
  document.querySelectorAll('.miss').forEach(x => x.classList.remove('miss'));
  if (!d.focus.trim()) miss.push('#focus');
  if (M && !d.opp.trim()) miss.push('#opp');
  (M ? FM : F).forEach(([n]) => { if (!d[n]) miss.push(`.row[data-row=${n}]`); });
  if (M) MQ.forEach(([k]) => { if (!d[k].trim()) miss.push('#' + k); });
  if (!d.next.trim()) miss.push('#next');
  if (miss.length) {
    miss.forEach(q => { const el = $(q); if (el) el.classList.add('miss'); });
    const first = $(miss[0]); if (first) first.scrollIntoView({ behavior: 'smooth', block: 'center' });
    toast(`まだ書いていないところが${miss.length}か所あります（黄色のところ）`); return;
  }
  const e = { id: uid(), date: d.date, type: M ? 'match' : 'practice', focus: d.focus.trim(), n1: d.n1, n2: d.n2, n3: d.n3,
    r1: d.n1 <= 2 ? d.r1.trim() : '', r2: d.n2 <= 2 ? d.r2.trim() : '', r3: d.n3 <= 2 ? d.r3.trim() : '',
    next: d.next.trim(), at: new Date().toISOString() };
  if (M) Object.assign(e, { opp: d.opp.trim(), n4: d.n4, r4: d.n4 <= 2 ? d.r4.trim() : '', mgood: d.mgood.trim(), mbad: d.mbad.trim(), tgood: d.tgood.trim(), tbad: d.tbad.trim(), mprac: d.mprac.trim(), tocoach: d.tocoach.trim() });
  else Object.assign(e, { good: d.good.trim(), bad: d.bad.trim(), heard: d.heard.trim() });
  S.outbox.push(e); S.draft = null; store.del('draft'); save();
  $('#submit').disabled = true;
  await flush();
  toast(S.outbox.some(x => x.id === e.id) ? '保存しました。ネットにつながったら送ります' : '提出しました');
  S.tab = 'history'; render(); window.scrollTo(0, 0);
}

const isLow = e => fieldsOf(e).some(([n]) => e[n] && e[n] <= 2);
function entryHTML(e, o) {
  const rs = (o.replies || []);
  const M = e.type === 'match';
  const reasons = fieldsOf(e).filter(([n, , r]) => e[n] <= 2 && e[r]).map(([n, l, r]) => `<div class="kv lowr"><span class="k">${l} ${e[n]} の理由</span>${esc(e[r])}</div>`).join('');
  const detail = `${e.good ? `<div class="kv"><span class="k">よかったプレー</span>${esc(e.good)}</div>` : ''}
      ${e.bad ? `<div class="kv"><span class="k">うまくいかなかった・なぜ</span>${esc(e.bad)}</div>` : ''}
      ${e.heard ? `<div class="kv"><span class="k">言われたこと・気づいたこと</span>${esc(e.heard)}</div>` : ''}
      ${M ? MQ.map(([k, q]) => e[k] ? `<div class="kv"><span class="k">${q}</span>${esc(e[k])}</div>` : '').join('') : ''}`;
  const toc = e.tocoach ? `<div class="kv tocoach"><span class="k">顧問に伝えたいこと</span>${esc(e.tocoach)}</div>` : '';
  return `<div class="card ${o.coach && isLow(e) ? 'low' : ''} ${o.open ? 'open' : ''}" data-id="${e.id}">
    <div class="date"><span>${o.who ? `${esc(o.who)}　` : ''}${jdate(e.date)}${M ? ' <span class="tag match">MATCH</span>' : ''}</span>${o.tag || ''}</div>
    <div class="kv"><span class="k">FOCUS　今日意識すること</span>${esc(e.focus)}</div>
    ${M ? `<div class="kv"><span class="k">MATCH　相手と結果</span>${esc(e.opp)}</div>` : ''}
    <div class="nums">意識できた <b>${e.n1}</b>　体 <b>${e.n2}</b>　気持ち <b>${e.n3}</b>${M ? `　出来 <b>${e.n4}</b>` : ''}</div>
    ${o.coach ? reasons + toc : ''}
    <div class="more">${o.coach ? '' : reasons}${detail}${o.coach ? '' : toc}</div>
    <div class="kv"><span class="k">NEXT　次にどうする</span>${esc(e.next)}</div>
    ${rs.map(r => `<div class="coach"><span class="en">COACH</span>　佐藤から\n${esc(r.text)}</div>`).join('') || (e._wait || o.coach ? '' : '<div class="mini" style="margin-top:6px">（返事はまだ）</div>')}
    ${o.coach ? `<div class="q">${rs.length ? 'もう一言' : 'COACH　佐藤から'}</div><textarea class="rep" id="rep_${e.id}" placeholder="一言">${esc(S.repDraft[e.id] || '')}</textarea><button class="btn send" data-id="${e.id}" style="margin-top:8px;padding:11px">返事を送る</button>` : ''}
    <button class="toggle">${o.open ? '閉じる' : '全部の中身を見る'}</button></div>`;
}
function bindCards() {
  document.querySelectorAll('.toggle').forEach(b => b.onclick = () => { const c = b.closest('.card'); c.classList.toggle('open'); b.textContent = c.classList.contains('open') ? '閉じる' : '全部の中身を見る'; });
}
function renderHistory() {
  const list = allEntries();
  S.justSeen = unseen().map(r => r.id);
  const body = list.length ? list.map(e => {
    const rs = repliesFor(e.id); const fresh = rs.some(r => S.justSeen.includes(r.id));
    return entryHTML(e, { replies: rs, tag: e._wait ? '<span class="tag wait">送信待ち</span>' : fresh ? '<span class="tag">NEW</span>' : '' });
  }).join('') : '<p class="mini center" style="margin-top:40px">まだ記録がありません。「今日の記録」から書いてみよう</p>';
  shell(S.name, `<div class="list">${body}</div><div class="foot"><button class="link" id="reload">最新にする</button>　<button class="link" id="logout">この端末から合言葉を消す</button></div>`);
  bindCards(); bindFoot();
  S.seen = [...new Set([...S.seen, ...S.justSeen])]; save();
}
function bindFoot() {
  const r = $('#reload'); if (r) r.onclick = async () => { toast((await refresh()) ? '最新にしました' : 'ネットにつながっていません'); render(); };
  const l = $('#logout'); if (l) l.onclick = () => { if (!confirm('この端末から合言葉と記録の控えを消します。もう一度使うときは合言葉を入れ直します。よいですか？')) return; ['key', 'name', 'role', 'entries', 'replies', 'outbox', 'seen', 'draft', 'cd'].forEach(k => store.del(k)); location.reload(); };
}

/* ===== 顧問用 ===== */
const cRepliesFor = id => S.cd.replies.filter(r => r.entryId === id).sort((a, b) => Date.parse(a.at) - Date.parse(b.at));
const cSort = list => [...list].sort((a, b) => b.date.localeCompare(a.date) || (Date.parse(b.at) - Date.parse(a.at)));
const memberName = uid => (S.cd.members.find(m => m.id === uid) || {}).name || '？';
const unreplied = () => S.cd.entries.filter(e => !S.cd.replies.some(r => r.entryId === e.id));
function bindReplies() {
  document.querySelectorAll('textarea.rep').forEach(t => t.addEventListener('input', () => { S.repDraft[t.id.slice(4)] = t.value; }));
  document.querySelectorAll('.send').forEach(b => b.onclick = async () => {
    const id = b.dataset.id; const text = ($('#rep_' + id).value || '').trim();
    if (!text) { toast('一言を書いてから送ってください'); return; }
    b.disabled = true;
    try { const j = await api('reply', { key: S.key, entryId: id, text }); S.cd.replies.push(j.reply); store.set('cd', S.cd); delete S.repDraft[id]; toast('送りました'); render(); }
    catch (e) { b.disabled = false; toast(e.server ? '送れませんでした：' + e.message : 'ネットにつながっていません。つながってからもう一度'); }
  });
}
function renderCoach() {
  if (S.tab === 'members') return S.member ? renderMember() : renderMembers();
  const list = cSort(S.showAll ? S.cd.entries : unreplied());
  const body = list.length ? list.map(e => entryHTML(e, { coach: true, open: true, who: memberName(e.uid), replies: cRepliesFor(e.id), tag: cRepliesFor(e.id).length ? '' : '<span class="tag">未返事</span>' })).join('')
    : `<p class="mini center" style="margin-top:40px">${S.showAll ? 'まだ記録がありません' : '返事を待っている記録はありません'}</p>`;
  shell('顧問用　' + S.name, `<div class="mini" style="margin:2px 0 10px">体・気持ち・出来などに1か2がある記録は、左に黄色の線が付きます</div>
    <div class="list">${body}</div>
    <div class="foot"><button class="link" id="all">${S.showAll ? '返事を待っている記録だけ見る' : '返事済みも見る'}</button>　<button class="link" id="reload">最新にする</button>　<button class="link" id="logout">この端末から合言葉を消す</button></div>`);
  $('#all').onclick = () => { S.showAll = !S.showAll; render(); };
  bindCards(); bindReplies(); bindFoot();
}
function renderMembers() {
  const rows = S.cd.members.map(m => {
    const es = cSort(S.cd.entries.filter(e => e.uid === m.id)); const last = es[0];
    const wait = es.filter(e => !S.cd.replies.some(r => r.entryId === e.id)).length;
    return `<div class="card member" data-uid="${m.id}"><div class="date"><span>${esc(m.name)}</span>${wait ? `<span class="tag">未返事 ${wait}</span>` : ''}</div>
      <div class="mini">記録 ${es.length}件　${last ? `最後 ${jdate(last.date)}` : 'まだ記録なし'}</div>
      ${last ? `<div class="nums">意識できた <b>${last.n1}</b>　体 <b>${last.n2}</b>　気持ち <b>${last.n3}</b>${last.type === 'match' ? `　出来 <b>${last.n4}</b>` : ''}</div>` : ''}</div>`;
  }).join('');
  shell('顧問用　' + S.name, `<div class="list">${rows || '<p class="mini center">部員がまだいません</p>'}</div><div class="foot"><button class="link" id="reload">最新にする</button></div>`);
  document.querySelectorAll('.member').forEach(c => c.onclick = () => { S.member = c.dataset.uid; render(); window.scrollTo(0, 0); });
  bindFoot();
}
function renderMember() {
  const es = cSort(S.cd.entries.filter(e => e.uid === S.member));
  shell('顧問用　' + memberName(S.member) + 'の記録', `<button class="link" id="back" style="margin-bottom:10px">← 部員ごとにもどる</button>
    <div class="list">${es.map(e => entryHTML(e, { coach: true, replies: cRepliesFor(e.id), tag: cRepliesFor(e.id).length ? '' : '<span class="tag">未返事</span>' })).join('') || '<p class="mini center">まだ記録がありません</p>'}</div>`);
  $('#back').onclick = () => { S.member = null; render(); };
  bindCards(); bindReplies();
}

function renderGraph() {
  const L = allEntries().slice(0, 14).reverse();
  let svg = '<p class="mini center" style="margin-top:30px">記録が2回以上たまると、グラフが出ます</p>';
  if (L.length >= 2) {
    const W = 320, Hh = 190, x0 = 36, x1 = 296, y = v => 170 - v * 30, x = i => x0 + (x1 - x0) * (L.length === 1 ? 0.5 : i / (L.length - 1));
    const S3 = [['n1', '#1F4E79', ''], ['n2', '#2E75B6', '6 4'], ['n3', '#FFC000', '']];
    svg = `<div class="card"><svg viewBox="0 0 ${W} ${Hh}" width="100%" role="img" aria-label="数字の推移">
    <g stroke="#e3e8ef">${[1, 2, 3, 4, 5].map(v => `<line x1="${x0}" x2="${x1}" y1="${y(v)}" y2="${y(v)}"/>`).join('')}</g>
    <g font-size="10" fill="#6f7782">${[1, 2, 3, 4, 5].map(v => `<text x="16" y="${y(v) + 4}">${v}</text>`).join('')}
    ${L.map((e, i) => (i === 0 || i === L.length - 1 || L.length <= 7) ? `<text x="${x(i)}" y="186" text-anchor="middle">${Number(e.date.slice(5, 7))}/${Number(e.date.slice(8))}</text>` : '').join('')}</g>
    ${S3.map(([k, c, d]) => `<polyline fill="none" stroke="${c}" stroke-width="2.5" ${d ? `stroke-dasharray="${d}"` : ''} points="${L.map((e, i) => `${x(i)},${y(e[k])}`).join(' ')}"/>` + L.map((e, i) => `<circle cx="${x(i)}" cy="${y(e[k])}" r="3.2" fill="${c}"/>`).join('')).join('')}
    </svg><div class="legend"><span><i style="--c:#1F4E79"></i>意識できた</span><span><i class="d" style="--c:#2E75B6"></i>体（破線）</span><span><i style="--c:#FFC000"></i>気持ち</span></div></div>`;
  }
  const low = allEntries().filter(e => fieldsOf(e).some(([n, , r]) => e[n] <= 2 && e[r])).slice(0, 5);
  shell(S.name, `<div class="h" style="margin-top:4px"><span class="en">TREND</span><span class="ja">数字の推移</span></div><div class="hint">最近14回まで</div>${svg}
  ${low.length ? `<div class="h"><span class="en">LOW</span><span class="ja">1・2を付けた日</span></div>${low.map(e => `<div class="card" style="margin-bottom:8px"><div class="date">${jdate(e.date)}</div>${fieldsOf(e).filter(([n, , r]) => e[n] <= 2 && e[r]).map(([n, l, r]) => `<div class="kv"><span class="k">${l} ${e[n]}</span>${esc(e[r])}</div>`).join('')}</div>`).join('')}` : ''}`);
}

function render() {
  if (!S.key) return renderLogin();
  if (S.role === 'coach') return renderCoach();
  if (S.tab === 'history') return renderHistory();
  if (S.tab === 'graph') return renderGraph();
  return renderToday();
}

window.addEventListener('online', async () => { await refresh(); render(); });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') saveDraft(); });
render();
if (S.key && S.role === 'coach') refresh().then(ok => { if (ok) render(); });
else if (S.key) refresh().then(ok => { if (ok && S.tab !== 'today') render(); else if (ok) { const n = unseen().length; if (n) { toast(`佐藤からの返事が${n}件あります`); render(); } } });
</script>
</body>
</html>
