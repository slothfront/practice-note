<body>
<div id="app"></div>
<script>
'use strict';
/* ===== 設定 =====
   GAS_URL が空のあいだは「見本モード」（スマホの中だけで動く・本物には送らない） */
const GAS_URL = 'https://script.google.com/macros/s/AKfycbxONTyT55jOqV12OJ_zWSkl8_twA-D3VZa05XI5MdI6baa14Qw06jIdtZdWlyLu8OE2/exec';
const DEMO = !GAS_URL;

/* ===== 保存（使えない端末でも落ちない） ===== */
const store = {
  get(k, d) { try { const v = localStorage.getItem('pn_' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('pn_' + k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem('pn_' + k); } catch (e) {} }
};

/* ===== 通信 ===== */
async function api(action, body) {
  if (DEMO) return demoApi(action, body);
  const res = await fetch(GAS_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action, ...body }) });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const j = await res.json();
  if (!j.ok) { const e = new Error(j.error || 'error'); e.server = true; throw e; }
  return j;
}

/* 見本モードの受け口（GASと同じ形で返す） */
function demoDb() {
  let db = store.get('demo_db2', null);
  if (!db) {
    const E = (id, uid, date, o) => ({ id, uid, date, type: 'practice', focus: '', n1: 3, n2: 3, n3: 3, r1: '', r2: '', r3: '', good: '', bad: '', heard: '', next: '', at: date + 'T19:00:00+09:00', ...o });
    db = { users: { demo: { id: 'uA', name: '部員A' }, demo2: { id: 'uB', name: '部員B' }, demo3: { id: 'uC', name: '部員C' }, coach: { id: 'coach', name: '佐藤', role: 'coach' } }, entries: [
      E('d1', 'uA', '2026-11-16', { focus: 'ネット際は最初の一歩', n1: 2, r1: 'ネット際に間に合わなかった', bad: '移動が遅かった。ボールを見てから動いていた', next: '声を一番に出す' }),
      E('d2', 'uA', '2026-11-17', { focus: '声を一番に出す', n1: 4, n2: 4, n3: 5, good: '「はい」を先に言えてお見合いが無かった', next: '構えを早く作る' }),
      E('d3', 'uA', '2026-11-18', { focus: '構えを早く作る', n1: 3, n2: 4, n3: 4, bad: 'サーブカットが長くなった', heard: '腕を振らずに面を向ける、と言われた', next: 'サーブカットで腕を振らず、面を向ける' }),
      E('b1', 'uB', '2026-11-17', { focus: 'スパイクを最後まで振り切る', n1: 4, n2: 4, n3: 4, good: '強打が3本決まった', next: 'ブロックの上から打つ' }),
      E('b2', 'uB', '2026-11-18', { type: 'match', focus: 'ブロックの上から打つ', opp: '練習試合 安房 1-2', n1: 3, n2: 2, n3: 3, n4: 3, r2: 'ふくらはぎがつった', mgood: '2セット目の終盤、ライトから2本続けて決めた', mbad: 'サーブカットが乱れて、こちらの攻撃が単調になった。足が止まっていたから', tgood: '負けていても声が切れなかった', tbad: 'お見合いが多かった', mprac: '二段トスの練習', next: 'サーブカットは足を止めない', tocoach: 'ふくらはぎのストレッチのやり方を知りたいです', at: '2026-11-18T20:10:00+09:00' }),
      E('c1', 'uC', '2026-11-19', { focus: 'トスの高さをそろえる', n1: 4, n2: 3, n3: 2, r3: 'テスト前で不安', good: 'Aクイックが2本合った', next: '二段トスも高さをそろえる', at: '2026-11-19T18:40:00+09:00' })
    ], replies: [
      { id: 'r1', entryId: 'd2', text: '声、よく出ていました。', at: '2026-11-17T21:00:00+09:00' },
      { id: 'r2', entryId: 'd3', text: '構えが早くなってきたのは見ていて分かります。明日は面の向きを。', at: '2026-11-18T21:30:00+09:00' },
      { id: 'r3', entryId: 'b1', text: '振り切れていました。', at: '2026-11-17T21:10:00+09:00' }
    ] };
    store.set('demo_db2', db);
  }
  return db;
}
async function demoApi(action, b) {
  await new Promise(r => setTimeout(r, 250));
  if (!navigator.onLine) throw new Error('offline');
  const db = demoDb();
  const user = db.users[b.key];
  if (!user) { const e = new Error('合言葉がちがいます'); e.server = true; throw e; }
  const isCoach = user.role === 'coach';
  if (action === 'login') return { ok: true, name: user.name, me: user.id, role: isCoach ? 'coach' : 'student', needSet: false };
  if (action === 'submit' && !isCoach) {
    if (!db.entries.some(x => x.id === b.entry.id)) db.entries.push({ ...b.entry, uid: user.id });
    store.set('demo_db2', db); return { ok: true, id: b.entry.id };
  }
  if (action === 'list' && !isCoach) {
    const mine = db.entries.filter(x => x.uid === user.id).map(({ uid, ...x }) => x);
    const ids = new Set(mine.map(x => x.id));
    return { ok: true, name: user.name, entries: mine, replies: db.replies.filter(r => ids.has(r.entryId)), reports: (db.reports || []).filter(r => r.uid === user.id || r.uid === 'team') };
  }
  if (action === 'coachList' && isCoach) {
    return { ok: true, name: user.name, members: Object.values(db.users).filter(u => u.role !== 'coach').map(u => ({ id: u.id, name: u.name })), entries: db.entries, replies: db.replies, reports: db.reports || [] };
  }
  if (action === 'reply' && isCoach) {
    if (!db.entries.some(x => x.id === b.entryId)) { const e = new Error('記録が見つかりません'); e.server = true; throw e; }
    const r = { id: 'r' + Date.now().toString(36), entryId: b.entryId, text: b.text, at: new Date().toISOString(), by: user.name, byId: user.id, edited: '' };
    db.replies.push(r); store.set('demo_db2', db); return { ok: true, reply: r };
  }
  if (action === 'editReply' && isCoach) { const r = db.replies.find(x => x.id === b.replyId); if (!r) throw Object.assign(new Error('返事が見つかりません'), { server: true }); r.text = b.text; r.edited = new Date().toISOString(); store.set('demo_db2', db); return { ok: true, reply: r }; }
  if (action === 'deleteReply' && isCoach) { db.replies = db.replies.filter(x => x.id !== b.replyId); store.set('demo_db2', db); return { ok: true }; }
  if (action === 'star' && !isCoach) { const e = db.entries.find(x => x.id === b.entryId && x.uid === user.id); if (!e) throw Object.assign(new Error('記録が見つかりません'), { server: true }); e.star = b.star ? '1' : ''; store.set('demo_db2', db); return { ok: true }; }
  if (action === 'addReports' && isCoach) { db.reports = (db.reports || []).filter(r => r.matchId !== b.matchId); const now = new Date().toISOString(); const add = b.items.map((it, i) => ({ id: 'p' + Date.now().toString(36) + i, matchId: b.matchId, uid: it.uid, at: now, data: it.data })); db.reports.push(...add); store.set('demo_db2', db); return { ok: true, reports: add }; }
  if (action === 'deleteReports' && isCoach) { db.reports = (db.reports || []).filter(r => r.matchId !== b.matchId); store.set('demo_db2', db); return { ok: true }; }
  const e = new Error('できない操作です'); e.server = true; throw e;
}

/* ===== 状態 ===== */
const S = {
  key: store.get('key', ''), name: store.get('name', ''), role: store.get('role', 'student'), needSet: store.get('needSet', false), me: store.get('me', ''), editing: null, editingN: null, notices: store.get('notices', []), seenN: store.get('seenN', []), reportedN: store.get('reportedN', []),
  cd: store.get('cd', { members: [], entries: [], replies: [] }), reports: store.get('reports', []), seenRep: store.get('seenRep', []), imp: null, member: null, showAll: false, repDraft: {},
  entries: store.get('entries', []), replies: store.get('replies', []),
  outbox: store.get('outbox', []), seen: store.get('seen', []),
  tab: 'today', draft: store.get('draft', null), justSeen: [], hmode: store.get('hmode', 'all'), hq: '', starOnly: false
};
const save = () => { store.set('reports', S.reports); store.set('seenRep', S.seenRep); store.set('notices', S.notices); store.set('seenN', S.seenN); store.set('reportedN', S.reportedN); store.set('entries', S.entries); store.set('replies', S.replies); store.set('outbox', S.outbox); store.set('seen', S.seen); };

/* ===== 道具 ===== */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const today = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const WD = ['日', '月', '火', '水', '木', '金', '土'];
const jdate = s => { const [y, m, d] = s.split('-').map(Number); const w = WD[new Date(y, m - 1, d).getDay()]; return `${m}月${d}日（${w}）`; };
const localDate = iso => { const d = new Date(iso); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
function toast(msg) { document.querySelectorAll('.toast').forEach(x => x.remove()); const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2600); }
const allEntries = () => { const ids = new Set(S.entries.map(e => e.id)); return [...S.entries, ...S.outbox.filter(e => !ids.has(e.id)).map(e => ({ ...e, _wait: true }))].sort((a, b) => b.date.localeCompare(a.date) || (Date.parse(b.at) - Date.parse(a.at))); };

/* ===== 同期 ===== */
async function flush() {
  if (!S.outbox.length) return;
  for (const e of [...S.outbox]) {
    try { await api('submit', { key: S.key, entry: e }); S.outbox = S.outbox.filter(x => x.id !== e.id); if (!S.entries.some(x => x.id === e.id)) S.entries.push(e); save(); }
    catch (err) { if (err.server) { /* 受け口が断った */ } break; }
  }
}
const clearLocal = () => ['key', 'name', 'role', 'needSet', 'me', 'entries', 'replies', 'outbox', 'seen', 'draft', 'cd', 'notices', 'seenN', 'reportedN', 'reports', 'seenRep'].forEach(k => store.del(k));
function forgetIfBadKey(e) {
  if (e && e.server && /先に自分の合言葉/.test(e.message || '')) { S.needSet = true; store.set('needSet', true); render(); return; }
  if (e && e.server && /合言葉/.test(e.message || '')) { clearLocal(); location.reload(); }
}
async function refresh() {
  if (S.role === 'coach') {
    try { const j = await api('coachList', { key: S.key }); S.cd = { members: j.members, entries: j.entries, replies: j.replies, notices: j.notices || [], reads: j.reads || [], reports: parseReports(j.reports) }; if (j.me) { S.me = j.me; store.set('me', S.me); } store.set('cd', S.cd); return true; } catch (e) { forgetIfBadKey(e); return false; }
  }
  try {
    await flush();
    const j = await api('list', { key: S.key });
    S.entries = (j.entries || []).map(e => Object.assign(e, { star: e.star === true || e.star === '1' || e.star === 1 })); S.replies = j.replies; S.notices = j.notices || []; S.reports = parseReports(j.reports); if (j.name) { S.name = j.name; store.set('name', j.name); }

}

async function submit() {
  saveDraft(); const d = S.draft; const miss = []; const M = d.type === 'match';
  document.querySelectorAll('.miss').forEach(x => x.classList.remove('miss'));
  if (!d.focus.trim()) miss.push('#focus');
  if (M && !d.opp.trim()) miss.push('#opp');
  (M ? FM : F).forEach(([n]) => { if (!d[n]) miss.push(`.row[data-row=${n}]`); });
  if (M) MQ.forEach(([k]) => { if (!d[k].trim()) miss.push('#' + k); });
  if (!d.next.trim()) miss.push('#next');
  if (miss.length) {
    miss.forEach(q => { const el = $(q); if (el) el.classList.add('miss'); });
    const first = $(miss[0]); if (first) first.scrollIntoView({ behavior: 'smooth', block: 'center' });
    toast(`まだ書いていないところが${miss.length}か所あります（黄色のところ）`); return;
  }
  const e = { id: uid(), date: d.date, type: M ? 'match' : 'practice', focus: d.focus.trim(), n1: d.n1, n2: d.n2, n3: d.n3,
    r1: d.n1 <= 2 ? d.r1.trim() : '', r2: d.n2 <= 2 ? d.r2.trim() : '', r3: d.n3 <= 2 ? d.r3.trim() : '',
    next: d.next.trim(), at: new Date().toISOString() };
  if (M) Object.assign(e, { opp: d.opp.trim(), n4: d.n4, r4: d.n4 <= 2 ? d.r4.trim() : '', mgood: d.mgood.trim(), mbad: d.mbad.trim(), tgood: d.tgood.trim(), tbad: d.tbad.trim(), mprac: d.mprac.trim(), tocoach: d.tocoach.trim() });
  else Object.assign(e, { good: d.good.trim(), bad: d.bad.trim(), heard: d.heard.trim() });
  S.outbox.push(e); S.draft = null; store.del('draft'); save();
  $('#submit').disabled = true;
  await flush();
  toast(S.outbox.some(x => x.id === e.id) ? '保存しました。ネットにつながったら送ります' : '提出しました');
  S.tab = 'history'; render(); window.scrollTo(0, 0);
}

const INS = [['heard', '言われたこと・気づいたこと'], ['bad', 'うまくいかなかった・なぜ'], ['mbad', '課題（どの場面で・なぜ）'], ['tbad', 'チームに足りなかったところ'], ['mprac', '練習で取り組みたいこと'], ['next', 'NEXT　次にどうする']];
const hl = t => { const q = S.hq.trim(); const x = esc(t); if (!q) return x; const qq = esc(q).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); return x.replace(new RegExp(qq, 'gi'), m => `<mark>${m}</mark>`); };
const hasQ = t => { const q = S.hq.trim().toLowerCase(); return !q || String(t || '').toLowerCase().includes(q); };
const entryText = e => [...TEXT_KEYS.map(k => e[k] || ''), ...repliesFor(e.id).map(r => r.text)].join('\n');
function insightHTML(e) {
  const rows = INS.filter(([k]) => e[k] && hasQ(e[k]));
  if (!rows.length) return '';
  return `<div class="card ins"><div class="date"><span>${jdate(e.date)}${e.type === 'match' ? ' <span class="tag match">MATCH</span>' : ''}</span><span>${e._wait ? '<span class="tag wait">送信待ち</span>' : starBtn(e)}</span></div>
    ${rows.map(([k, l]) => `<div class="kv"><span class="k">${l}</span>${hl(e[k])}</div>`).join('')}</div>`;
}
function historyList() {
  let list = allEntries(); if (S.starOnly) list = list.filter(e => e.star);
  const q = S.hq.trim();
  if (S.hmode === 'note') { const h = list.map(insightHTML).filter(Boolean); return h.length ? h.join('') : `<p class="mini center" style="margin-top:30px">${q || S.starOnly ? '当てはまるものがありません' : '「気づいたこと」「うまくいかなかった・なぜ」「NEXT」などを書くと、ここにたまります'}</p>`; }
  if (q) list = list.filter(e => hasQ(entryText(e)));
  return list.length ? list.map(e => {
    const rs = repliesFor(e.id); const fresh = rs.some(r => S.justSeen.includes(rkey(r)));
    return entryHTML(e, { replies: rs, open: !!q, tag: e._wait ? '<span class="tag wait">送信待ち</span>' : fresh ? '<span class="tag">NEW</span>' : '' });
  }).join('') : `<p class="mini center" style="margin-top:30px">${q || S.starOnly ? '当てはまるものがありません' : 'まだ記録がありません。「今日の記録」から書いてみよう'}</p>`;
}
function bindHistoryList() {
  bindCards();
  document.querySelectorAll('.starb').forEach(b => b.onclick = async ev => {
    ev.stopPropagation(); const id = b.dataset.star; const e = S.entries.find(x => x.id === id); if (!e) return;
    const v = !e.star; e.star = v; save(); refreshList();
    try { await api('star', { key: S.key, entryId: id, star: v }); }
    catch (err) { e.star = !v; save(); refreshList(); toast(err.server ? err.message : 'ネットにつながっていません。つながってからもう一度'); }
  });
  if (S.hq.trim() && S.hmode === 'all') document.querySelectorAll('#hlist .kv').forEach(k => { const t = k.lastChild; if (t && t.nodeType === 3 && hasQ(t.textContent) && S.hq.trim()) { const sp = document.createElement('span'); sp.innerHTML = hl(t.textContent); k.replaceChild(sp, t); } });
}
function refreshList() { const el = $('#hlist'); if (!el) return; el.innerHTML = historyList(); bindHistoryList(); }
function renderHistory() {
  S.justSeen = unseen().map(rkey);
  shell(S.name, `<div class="hctl"><div class="seg"><button data-hm="all" class="${S.hmode === 'all' ? 'on' : ''}">全部</button><button data-hm="note" class="${S.hmode === 'note' ? 'on' : ''}">気づき</button></div>

const cRepliesFor = id => S.cd.replies.filter(r => r.entryId === id).sort((a, b) => Date.parse(a.at) - Date.parse(b.at));
const cSort = list => [...list].sort((a, b) => b.date.localeCompare(a.date) || (Date.parse(b.at) - Date.parse(a.at)));
const memberName = uid => (S.cd.members.find(m => m.id === uid) || {}).name || '？';
const unreplied = () => S.cd.entries.filter(e => !S.cd.replies.some(r => r.entryId === e.id));
function bindReplies() {
  document.querySelectorAll('.mini-btn.edit').forEach(b => b.onclick = () => { S.editing = b.dataset.rid; render(); const t = $('#ed_' + S.editing); if (t) t.focus(); });

    catch (e) { b.disabled = false; toast(e.server ? e.message : 'ネットにつながっていません。つながってからもう一度'); }

    catch (e) { b.disabled = false; toast(e.server ? '送れませんでした：' + e.message : 'ネットにつながっていません。つながってからもう一度'); }
  });
}

/* ===== 試合レポート ===== */
/* 受け口からは {id, matchId, uid, at, data(文字列)} で来る。data＝レポートのファイルの中の1人分（uid=team はチーム版） */
function parseReports(list) {
  return (list || []).map(r => { let d = r.data; if (typeof d === 'string') { try { d = JSON.parse(d); } catch (e) { d = null; } } return d ? { id: String(r.id), matchId: String(r.matchId), uid: String(r.uid), at: String(r.at || ''), d } : null; }).filter(Boolean);
}
const rkeyRep = r => r.id + '@' + r.at;
const myReports = () => S.reports.filter(r => r.uid !== 'team').sort((a, b) => (b.d.match.date || '').localeCompare(a.d.match.date || '') || Date.parse(b.at) - Date.parse(a.at));
const teamReportOf = mid => S.reports.find(r => r.uid === 'team' && r.matchId === mid);
const unseenRep = () => S.reports.filter(r => !S.seenRep.includes(rkeyRep(r)));
const pct = x => x == null ? '—' : (Math.round(Math.abs(x) * 100) * (x < 0 ? -1 : 1) < 0 ? '−' : '') + Math.round(Math.abs(x) * 100) + '%';
const share = (a, b) => b ? Math.round(a / b * 100) + '%' : '—';
const pdiff = (a, b) => { if (a == null || b == null) return '—'; const v = Math.round(a * 100) - Math.round(b * 100); return (v > 0 ? '+' : v < 0 ? '−' : '±') + Math.abs(v); };
const sl = (k, v) => `<div class="sline"><b>${k}</b>${v}</div>`;
function statsHTML(p, notes, prev) {
  const n = p.stats || {}, T = p.teamStats || {}; const few = (n.att || 0) < 5;
  const vs = prev ? prev.stats || {} : null;
  const cmp = (lab, a, b, f) => sl(lab, `${f(a)}　<span class="mini">前回 ${f(b)}${a != null && b != null && f === pct ? `（${pdiff(a, b)}）` : ''}</span>`);
  return `<div class="h"><span class="en">MATCH STATS</span><span class="ja">この試合の数字</span></div><div class="card">
    ${sl('スパイク', `決定 ${n.kill}　ミス ${n.serr}`)}${sl('　（第2〜第5セット）', `打数 ${n.att}　決定率 ${pct(n.krate)}　効果率 ${pct(n.keff)}`)}
    ${sl('サーブ', `本数 ${n.sv}　エース ${n.ace}　ミス ${n.sverr}　効果率 ${pct(n.seff)}`)}
    ${sl('サーブレシーブ', `ミス ${n.recv}`)}${sl('レシーブ', `上げた ${n.dig}　ミス ${n.derr}`)}${sl('ブロック', `決定 ${n.blk}　タッチ ${n.bt}`)}
    ${sl('そのほかのミス', `カバー ${n.cov}　トス ${n.toss}　返球 ${n.ret}　その他 ${n.oth}`)}
    <div class="rnote" style="margin-top:6px">効果率＝（決定−ミス）÷打数、サーブは（エース−ミス）÷本数。${esc((notes || []).join(''))}</div></div>
  <div class="h"><span class="en">IN THE TEAM</span><span class="ja">チームの中で</span></div><div class="card">
    <div class="subh">チームに占める割合</div>
    ${sl('スパイク', `打数 ${share(n.att, T.att)}　決定 ${share(n.k25, T.k25)}　ミス ${share(n.e25, T.e25)}`)}
    ${sl('サーブ', `本数 ${share(n.sv, T.sv)}　エース ${share(n.ace, T.ace)}　ミス ${share(n.sverr, T.sverr)}`)}
    ${sl('サーブレシーブ', `ミス ${share(n.recv, T.recv)}`)}${sl('レシーブ', `上げた ${share(n.dig, T.dig)}　ミス ${share(n.derr, T.derr)}`)}
    <div class="subh">チーム全体との差（ポイント）</div>
    ${sl('スパイク決定率', `${few ? '—（打数5本未満）' : pdiff(n.krate, T.krate)}（チーム ${pct(T.krate)}）`)}
    ${sl('スパイク効果率', `${few ? '—（打数5本未満）' : pdiff(n.keff, T.keff)}（チーム ${pct(T.keff)}）`)}
    ${sl('サーブ効果率', `${pdiff(n.seff, T.seff)}（チーム ${pct(T.seff)}）`)}
    <div class="subh">前回との比較</div>
    ${vs ? `<div class="rnote">前回＝${esc(prev.match.title || '')}（${esc(prev.match.date || '')}）</div>` +
      cmp('スパイク決定率', few ? null : n.krate, (vs.att || 0) < 5 ? null : vs.krate, pct) + cmp('スパイク効果率', few ? null : n.keff, (vs.att || 0) < 5 ? null : vs.keff, pct) +
      cmp('サーブ効果率', n.seff, vs.seff, pct) + cmp('サーブレシーブのミス', n.recv, vs.recv, x => x == null ? '—' : x + '本') + cmp('レシーブで上げた', n.dig, vs.dig, x => x == null ? '—' : x + '本')
      : '<div class="rnote">この試合が1回目です。次の試合から並べます。</div>'}</div>`;
}
function blocksHTML(sections) {
  return (sections || []).map(sc => `<div class="h"><span class="en">${esc(sc.en)}</span><span class="ja">${esc(sc.ja)}</span></div><div class="card rep">` +
    (sc.blocks || []).map(b => b.t === 'sub' ? `<h4>${esc(b.text)}</h4>` : b.t === 'note' ? `<p class="rnote">${esc(b.text)}</p>` :
      b.t === 'fig' ? `<figure><img alt="図" src="data:image/svg+xml;charset=utf-8,${encodeURIComponent(String(b.svg || ''))}">${b.cap ? `<figcaption>${esc(b.cap)}</figcaption>` : ''}</figure>` :
      `<p>${esc(b.text)}</p>`).join('') + (sc.en === "COACH'S NOTE" ? '<p class="rnote" style="text-align:right">佐藤</p>' : '') + '</div>').join('');
}
/* 1人分のレポート（prev＝同じ人の前の試合のレポート） */
function playerReportHTML(r, prev, team) {
  const d = r.d; const p = Object.assign({}, d.player, { teamStats: d.teamStats });
  return `<div class="mini">${esc(jdate(d.match.date))}</div>
    ${statsHTML(p, d.notes, prev ? Object.assign({ match: prev.d.match }, { stats: prev.d.player.stats }) : null)}
    ${blocksHTML(p.sections)}
    ${team ? `<details class="mrep" style="margin-top:16px"><summary><div class="h"><span class="en">TEAM REPORT</span><span class="ja">チームのレポート（タップで開く）</span></div></summary>${blocksHTML(team.d.sections)}</details>` : ''}`;
}
function prevOf(r, list) { const i = list.indexOf(r); return list.slice(i + 1).find(x => x.uid === r.uid) || null; }
function lastMatchCard() {
  const r = myReports()[0]; if (!r) return '';
  const n = r.d.player.stats || {}; const sm = r.d.player.summary || {}; const few = (n.att || 0) < 5;
  return `<div class="lastm"><div class="date"><span>LAST MATCH　<span class="mini">${esc(r.d.match.title)}（${esc(jdate(r.d.match.date))}）</span></span></div>
    <div style="margin:6px 0">${sl('スパイク', `決定 ${n.kill}・ミス ${n.serr}${few ? '' : `（第2〜第5セットの効果率 ${pct(n.keff)}）`}`)}${sl('サーブ', `${n.sv}本・エース ${n.ace}・ミス ${n.sverr}`)}${sl('サーブレシーブ', `ミス ${n.recv}`)}</div>
    <div class="kv"><span class="k">FOCUS　伸ばしてほしいところ</span>${esc(sm.focus)}</div>
    <div class="kv"><span class="k">NEXT WEEK　次の1週間で意識すること</span>${esc(sm.next)}</div>
    <button class="toggle" id="toRep">レポートを全部見る</button></div>`;
}
function renderReports() {
  const list = myReports(); const fresh = unseenRep().map(rkeyRep);
  const body = list.length ? list.map((r, i) => {
    const inner = playerReportHTML(r, prevOf(r, list), teamReportOf(r.matchId));
    const tag = fresh.includes(rkeyRep(r)) ? '<span class="tag">NEW</span>' : '';
    return i === 0 ? `<div class="date" style="margin:4px 0"><span class="en" style="color:var(--ink2)">${esc(r.d.match.title)}</span>${tag}</div>${inner}`
      : `<details class="mrep"><summary><div class="card"><div class="date"><span>${esc(r.d.match.title)}　<span class="mini">${esc(jdate(r.d.match.date))}</span></span>${tag}</div></div></summary>${inner}</details>`;
  }).join('<hr style="border:0;border-top:1px dashed var(--line);margin:22px 0">') : '<p class="mini center" style="margin-top:40px">まだレポートはありません。試合のあとに佐藤から届きます</p>';
  shell(S.name, body + '<div class="foot"><button class="link" id="reload">最新にする</button></div>');
  bindFoot();
  S.seenRep = [...new Set([...S.seenRep, ...S.reports.map(rkeyRep)])]; save();
}

/* ---- 顧問：レポートを読み込んで送る ---- */
const normName = x => String(x || '').replace(/[\s　]/g, '');
function guessUid(name) {
  const n = normName(name); const mem = S.cd.members || [];
  const hit = mem.filter(m => { const k = normName(m.name); return k && (n.includes(k) || k.includes(n)); });
  return hit.length === 1 ? hit[0].id : '';
}
function itemsOf(rep, map) {
  const base = { match: rep.match, notes: rep.notes || [] };
  const items = rep.players.map((p, i) => map[i] ? { uid: map[i], data: JSON.stringify(Object.assign({}, base, { teamStats: rep.team.stats, player: p })) } : null).filter(Boolean);
  if (rep.team) items.push({ uid: 'team', data: JSON.stringify(Object.assign({}, base, { sections: rep.team.sections, stats: rep.team.stats })) });
  return items;
}
function renderCoachReports() {
  const mem = S.cd.members || []; const reps = S.cd.reports || [];
  const byMatch = {}; reps.forEach(r => { (byMatch[r.matchId] = byMatch[r.matchId] || []).push(r); });
  const sent = Object.values(byMatch).sort((a, b) => (b[0].d.match.date || '').localeCompare(a[0].d.match.date || ''));
  const I = S.imp;
  const impHTML = !I ? `<div class="card"><div class="h" style="margin-top:0"><span class="en">IMPORT</span><span class="ja">レポートを読み込む</span></div>
      <div class="hint">フジ子が作ったレポートのファイル（.json）を選ぶ。送る前に中身を確かめられます</div>
      <input type="file" id="rfile" accept=".json,application/json"></div>`
    : `<div class="card"><div class="h" style="margin-top:0"><span class="en">CHECK</span><span class="ja">送る前に確かめる</span></div>
      <div class="date"><span>${esc(I.rep.match.title)}　<span class="mini">${esc(jdate(I.rep.match.date))}</span></span></div>
      ${byMatch[I.rep.match.id] ? '<div class="err">この試合のレポートはもう送っています。送ると前のものと入れ替わります</div>' : ''}
      <div class="hint" style="margin-top:8px">だれに送るか（自動で合わせています。違っていたら選び直す）</div>
      ${I.rep.players.map((p, i) => `<div class="mapr"><span>${esc(p.name)}</span><select data-i="${i}" class="rmap"><option value="">送らない</option>${mem.map(m => `<option value="${m.id}" ${I.map[i] === m.id ? 'selected' : ''}>${esc(m.name)}</option>`).join('')}</select><button class="mini-btn rview" data-i="${i}">見る</button></div>`).join('')}
      ${I.rep.team ? '<div class="mini" style="margin-top:6px">チーム版は全員に届きます</div>' : ''}
      <button class="btn" id="rsend" style="padding:12px">送る</button><button class="btn ghost" id="rcancel" style="margin-top:8px;padding:10px">やめる</button></div>
      ${I.view != null ? `<div class="h"><span class="en">PREVIEW</span><span class="ja">${esc(I.rep.players[I.view].name)}の画面</span></div>` +
        playerReportHTML({ d: { match: I.rep.match, notes: I.rep.notes, teamStats: I.rep.team.stats, player: I.rep.players[I.view] } }, null, null) : ''}`;
  const sentHTML = sent.map(list => {
    const m = list[0].d.match; const who = list.filter(r => r.uid !== 'team').map(r => (mem.find(x => x.id === r.uid) || {}).name || '？');
    return `<div class="card"><div class="date"><span>${esc(m.title)}　<span class="mini">${esc(jdate(m.date))}</span></span></div>
      <div class="mini">送った相手：${who.map(esc).join('・') || 'なし'}${list.some(r => r.uid === 'team') ? '＋チーム版（全員）' : ''}</div>
      <div class="rbtns" style="flex-wrap:wrap">${list.filter(r => r.uid !== 'team').map(r => `<button class="mini-btn cview" data-mid="${esc(r.matchId)}" data-uid="${esc(r.uid)}">${esc((mem.find(x => x.id === r.uid) || {}).name || '？')}</button>`).join('')}${list.some(r => r.uid === 'team') ? `<button class="mini-btn cview" data-mid="${esc(list[0].matchId)}" data-uid="team">チーム版</button>` : ''}</div>
      <div class="rbtns"><button class="mini-btn del rdel" data-mid="${esc(list[0].matchId)}">この試合のレポートを消す</button></div></div>`;
  }).join('');
  const V = S.cview && reps.find(r => r.matchId === S.cview.mid && r.uid === S.cview.uid);
  let viewHTML = '';
  if (V) {
    const own = reps.filter(r => r.uid === V.uid).sort((a, b) => (b.d.match.date || '').localeCompare(a.d.match.date || '') || Date.parse(b.at) - Date.parse(a.at));
    const nm = V.uid === 'team' ? 'チーム版' : ((mem.find(x => x.id === V.uid) || {}).name || '？') + 'の画面';
    viewHTML = `<div class="h" id="cviewh"><span class="en">VIEW</span><span class="ja">${esc(nm)}　${esc(V.d.match.title)}</span></div><button class="link" id="cvclose">閉じる</button>` +
      (V.uid === 'team' ? blocksHTML(V.d.sections) : playerReportHTML(V, prevOf(V, own), null)) + '<button class="link" id="cvclose2" style="margin-top:10px">閉じる</button>';
  }
  shell('顧問用　' + S.name, `${impHTML}<div class="h"><span class="en">SENT</span><span class="ja">送ったレポート</span></div><div class="mini">名前を押すと、その部員の画面で見られます</div><div class="list">${sentHTML || '<p class="mini center">まだ送っていません</p>'}</div>${viewHTML}
    <div class="foot"><button class="link" id="reload">最新にする</button>　<button class="link" id="logout">この端末から合言葉を消す</button></div>`);
  const f = $('#rfile'); if (f) f.onchange = async () => {
    const file = f.files[0]; if (!file) return;
    try { const rep = JSON.parse(await file.text());
      if (rep.kind !== 'pn-report' || !rep.match || !Array.isArray(rep.players)) throw new Error('形');
      S.imp = { rep, map: rep.players.map(p => guessUid(p.name)), view: null }; render(); }
    catch (e) { toast('レポートのファイルではないようです'); }
  };
  document.querySelectorAll('.rmap').forEach(sel => sel.onchange = () => { S.imp.map[Number(sel.dataset.i)] = sel.value; });
  document.querySelectorAll('.rview').forEach(b => b.onclick = () => { S.imp.view = Number(b.dataset.i); pushNav(); render(); });
  const c = $('#rcancel'); if (c) c.onclick = () => { S.imp = null; render(); };
  const sbtn = $('#rsend'); if (sbtn) sbtn.onclick = async () => {
    const I = S.imp; const used = I.map.filter(Boolean);
    if (new Set(used).size !== used.length) { toast('同じ部員が2回選ばれています'); return; }
    if (!used.length) { toast('送る相手がいません'); return; }
    const skip = I.rep.players.filter((p, i) => !I.map[i]).map(p => p.name);
    if (!confirm(`${used.length}人に送ります${I.rep.team ? '（チーム版は全員）' : ''}。${skip.length ? `\n送らない：${skip.join('・')}` : ''}\nよいですか？`)) return;
    sbtn.disabled = true;
    try { const j = await api('addReports', { key: S.key, matchId: I.rep.match.id, items: itemsOf(I.rep, I.map) });
      S.cd.reports = [...(S.cd.reports || []).filter(r => r.matchId !== I.rep.match.id), ...parseReports(j.reports)]; store.set('cd', S.cd); S.imp = null; toast('送りました'); render(); }
    catch (e) { sbtn.disabled = false; toast(e.server ? e.message : 'ネットにつながっていません。つながってからもう一度'); }
  };
  document.querySelectorAll('.rdel').forEach(b => b.onclick = async () => {
    if (!confirm('この試合のレポートを消します。部員の画面からも消えます。よいですか？')) return;
    b.disabled = true; const mid = b.dataset.mid;
    try { await api('deleteReports', { key: S.key, matchId: mid }); S.cd.reports = (S.cd.reports || []).filter(r => r.matchId !== mid); store.set('cd', S.cd); toast('消しました'); render(); }
    catch (e) { b.disabled = false; toast(e.server ? e.message : 'ネットにつながっていません'); }
  });
  document.querySelectorAll('.cview').forEach(b => b.onclick = () => { S.cview = { mid: b.dataset.mid, uid: b.dataset.uid }; pushNav(); render(); const h = $('#cviewh'); if (h) window.scrollTo(0, h.getBoundingClientRect().top + window.scrollY - 120); });
  ['#cvclose', '#cvclose2'].forEach(q => { const x = $(q); if (x) x.onclick = () => history.back(); });
  bindFoot(); if (I && I.view != null) { const h = document.querySelectorAll('.h'); const last = [...h].find(x => x.textContent.includes('PREVIEW')); if (last) last.scrollIntoView(); }
}

function render() {
  if (!S.key) return renderLogin();
  if (S.needSet) return renderSetKey();
  if (S.role === 'coach') return renderCoach();
  if (S.tab === 'history') return renderHistory();
  if (S.tab === 'graph') return renderGraph();
  if (S.tab === 'report') return renderReports();
  return renderToday();
}

window.addEventListener('online', async () => { await refresh(); render(); });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') saveDraft(); });
try { history.replaceState(navState(), ''); } catch (e) {}
render();
if (S.key && S.role === 'coach') refresh().then(ok => { if (ok) render(); });
else if (S.key) refresh().then(ok => { if (!ok) return; const n = unseen().length, m = unseenN().length; if (S.tab !== 'today' || m) render(); if (n) toast(`先生からの返事が${n}件あります`); });
</script>
<script>
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
}
</script>
