# main の gas/ が変わったら、別のスクリプト「更新係」（gas-updater/）に合図する。
# 更新係が GitHub の同じコミットの gas/ を本体のGASに入れ、新しいバージョンでデプロイし直す（本体のURLは変わらない）。
# Secrets：GAS_UPDATER_URL（更新係のウェブアプリのURL）・GAS_UPDATE_TOKEN（更新係で makeUpdateToken を実行するとできる）。
name: GASを入れ替える
on:
  push:
    branches: [main]
    paths: ['gas/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gas-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: コードの形を確かめる
        run: |
          node -e "new Function(require('fs').readFileSync('gas/Code.gs','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('gas/appsscript.json','utf8'))"
      - name: 更新係に合図する
        env:
          TOKEN: ${{ secrets.GAS_UPDATE_TOKEN }}
          URL: ${{ secrets.GAS_UPDATER_URL }}
          SHA: ${{ github.sha }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$URL" ]; then echo "Secrets「GAS_UPDATE_TOKEN」「GAS_UPDATER_URL」がまだそろっていません"; exit 1; fi
          BODY=$(jq -cn --arg t "$TOKEN" --arg s "$SHA" '{token:$t,sha:$s}')
          # POST して、Google の転送先は GET で受け取る（curl は 302 で GET に切りかえる）
          RES=$(curl -sSL --max-time 120 -H 'Content-Type: text/plain;charset=utf-8' --data "$BODY" "$URL")
          echo "$RES" | jq -r '"結果：" + (.result // .error // "不明")' || echo "$RES" | head -c 300
          echo "$RES" | jq -e '.ok == true' > /dev/null
